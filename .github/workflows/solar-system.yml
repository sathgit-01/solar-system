name: Solar System Setup Workflow

on: 
 workflow_dispatch: 
 push:
    branches:  
      - main
      - 'feature/*'
env:
 MONGO_URI: ${{ vars.MONGO_URI}}
 MONGO_USERNAME: $${{ vars.MONGO_USERNAME}} 
 MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}   

jobs:
    unit-testing:
     name: Unit Test
     runs-on: ubuntu-latest
     steps:  
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: setup node js version - 18
        uses: actions/setup-node@v3
        with:
         node-version: '18'

      - name: Intstall Dependencies
        run: npm install
  
      - name: Unit Test
        run: npm test
        
